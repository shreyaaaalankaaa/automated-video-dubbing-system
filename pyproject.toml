[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idealabs-video-dubber"
version = "1.0.0"
description = "Resumable, quality-scored YouTube-to-English dubbing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shreya Lanka"}]
dependencies = [
  "yt-dlp[default]>=2026.7.4",
  "faster-whisper>=1.1.0",
  "edge-tts>=7.2.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]
background = [
  "demucs>=4.0.1",
]

[project.scripts]
video-dubber = "dubber.cli:main"

[tool.setuptools.packages.find]
include = ["dubber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
